# Same plant, force limit, and duration for every controller.
# moderate is the initial state in configs/lqr/balance.yaml.
name: two_link
n_links: 2
duration: 15.0
force_limit: 50.0
Q: [5.0, 50.0, 50.0, 1.0, 1.0, 1.0]
R: [0.1]
poles: [-2.0, -2.5, -3.0, -3.5, -4.0, -5.0]
cases:
  - name: mild
    qpos: [0.0, 0.05, -0.02]
    qvel: [0.0, 0.0, 0.0]
  - name: moderate
    qpos: [0.0, 0.25, -0.15]
    qvel: [0.0, 0.0, 0.0]
  # Hinges bend the same way, so the top link starts farther from upright.
  - name: hard
    qpos: [0.0, 0.30, 0.12]
    qvel: [0.0, 0.0, 0.0]
