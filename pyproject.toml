[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-link-cartpole"
version = "0.0.1"
description = "MuJoCo multi-link cartpole: classical control and RL on one plant."
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.17.0",
    "numpy==2.5.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim = ["*.xml"]
